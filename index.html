<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F766E">
<title>Trail 30 km — 10 oct. 2026</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --primary:#0F766E;
  --primary-dark:#115E59;
  --primary-light:#CCFBF1;
  --accent:#EA580C;
  --accent-light:#FED7AA;
  --bg:#FAFAF9;
  --card:#FFFFFF;
  --text:#18181B;
  --muted:#71717A;
  --border:#E4E4E7;
  --success:#16A34A;
  --danger:#DC2626;
  --warning:#D97706;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.08);
  --radius:14px;
  --radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0);
  --safe-bottom:env(safe-area-inset-bottom,0);
}
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}
body { min-height:100vh; min-height:100dvh; padding-bottom:calc(72px + var(--safe-bottom)); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-size: inherit; }
input, textarea { font-family: inherit; font-size: 16px; }

/* HEADER */
.app-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  padding: calc(var(--safe-top) + 16px) 20px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: var(--shadow);
}
.app-header h1 { font-size: 22px; font-weight: 700; letter-spacing:-0.02em; }
.app-header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 2px; font-weight:500; }
.app-header .countdown {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
.app-header .countdown-number { font-size: 24px; font-weight: 700; line-height:1; }

/* MAIN */
main { padding: 16px; max-width: 720px; margin: 0 auto; }
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

/* CARDS */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  border: 1px solid var(--border);
}
.card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px; }
.card h2 { font-size: 19px; font-weight: 700; margin-bottom: 8px; letter-spacing:-0.01em; }
.card h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--primary-light);
  color: var(--primary-dark);
}
.badge.accent { background: var(--accent-light); color: var(--accent); }
.badge.muted { background: #F4F4F5; color: var(--muted); }
.badge.success { background: #DCFCE7; color: var(--success); }

.btn {
  background: var(--primary);
  color: white;
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform .1s, background .15s;
}
.btn:active { transform: scale(0.97); }
.btn.secondary { background: #F4F4F5; color: var(--text); }
.btn.full { width: 100%; }
.btn.small { padding: 8px 14px; font-size: 13px; }
.btn.success { background: var(--success); }

/* TODAY */
.today-hero {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.today-hero::before {
  content:"";
  position: absolute;
  top:-40px; right:-40px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.today-hero .day-label { font-size: 13px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.today-hero .day-date { font-size: 28px; font-weight: 700; margin: 4px 0 12px; letter-spacing:-0.02em; }
.today-hero .session-type { font-size: 13px; font-weight: 600; padding: 4px 10px; background: rgba(255,255,255,0.22); border-radius:999px; display:inline-block; margin-bottom:8px; }
.today-hero .session-detail { font-size: 16px; line-height:1.5; opacity:0.95; }
.today-hero .week-info { display:flex; gap:10px; margin-top:14px; padding-top:14px; border-top: 1px solid rgba(255,255,255,0.2); font-size:12px; }
.today-hero .week-info > div { flex: 1; }
.today-hero .week-info strong { display:block; font-size:18px; font-weight:700; }

.kcal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
.kcal-box { background: #F4F4F5; padding: 10px 8px; border-radius: var(--radius-sm); text-align: center; }
.kcal-box .label { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 600; letter-spacing:0.05em; }
.kcal-box .value { font-size: 18px; font-weight: 700; color: var(--text); margin-top: 2px; }
.kcal-box.highlight { background: var(--primary-light); }
.kcal-box.highlight .value { color: var(--primary-dark); }

/* PLAN — Phase tabs */
.phase-tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
.phase-tab {
  padding: 8px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--muted);
}
.phase-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

/* PLAN — Week card */
.week-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  transition: box-shadow .2s;
}
.week-card.current { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.week-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}
.week-header-left { flex: 1; }
.week-num { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.week-title { font-size: 15px; font-weight: 600; margin-top: 2px; }
.week-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.week-progress { font-size: 12px; color: var(--primary); font-weight: 600; margin-left: 8px; }
.week-chevron { color: var(--muted); transition: transform .2s; }
.week-card.open .week-chevron { transform: rotate(180deg); }
.week-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.week-card.open .week-body { display: block; }

.session-item {
  display: flex;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #F4F4F5;
  align-items: flex-start;
}
.session-item:last-child { border-bottom: none; }
.session-checkbox {
  width: 24px; height: 24px;
  border-radius: 6px;
  border: 2px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: white;
  transition: all .15s;
  margin-top: 2px;
}
.session-checkbox.checked { background: var(--success); border-color: var(--success); }
.session-checkbox.checked::after { content:"✓"; color: white; font-size: 14px; font-weight: 700; }
.session-day { font-weight: 600; font-size: 14px; min-width: 64px; }
.session-content { flex: 1; }
.session-type-text { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 2px; }
.session-detail-text { font-size: 13px; color: var(--text); line-height: 1.4; }
.session-item.mma .session-type-text { color: var(--accent); }
.session-item.rest .session-type-text { color: var(--muted); }

/* PHASES */
.phase-overview {
  background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
  border: 1px solid #FDE68A;
  padding: 14px;
  border-radius: var(--radius);
  margin-bottom: 12px;
  font-size: 13px;
}
.phase-overview strong { color: #92400E; }

/* NUTRITION */
.macro-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.macro-box { background: #F4F4F5; padding: 12px 10px; border-radius: var(--radius-sm); text-align: center; }
.macro-box .name { font-size: 11px; color: var(--muted); font-weight: 600; }
.macro-box .num { font-size: 17px; font-weight: 700; margin-top: 3px; }
.macro-box.p { background: #FEE2E2; } .macro-box.p .num { color: #B91C1C; }
.macro-box.g { background: #DBEAFE; } .macro-box.g .num { color: #1D4ED8; }
.macro-box.l { background: #FEF3C7; } .macro-box.l .num { color: #92400E; }

.meal-day {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
}
.meal-day-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; display:flex; justify-content:space-between; }
.meal-day-name .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-light); color: var(--accent); font-weight: 600; }
.meal-row { font-size: 13px; color: var(--text); padding: 3px 0; display: flex; gap: 8px; }
.meal-row .meal-label { color: var(--muted); min-width: 65px; font-size: 12px; }

/* RECIPES */
.recipe-filter { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
.recipe-filter button {
  padding: 7px 13px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  color: var(--muted);
}
.recipe-filter button.active { background: var(--primary); color: white; border-color: var(--primary); }

.recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.recipe-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  cursor: pointer;
  transition: transform .1s;
}
.recipe-card:active { transform: scale(0.98); }
.recipe-emoji { font-size: 28px; margin-bottom: 6px; }
.recipe-name { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
.recipe-kcal { font-size: 11px; color: var(--muted); font-weight: 500; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--bg);
  width: 100%;
  max-width: 720px;
  max-height: 92dvh;
  border-radius: 20px 20px 0 0;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .25s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: calc(20px + var(--safe-bottom));
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: #D4D4D8; border-radius: 999px; margin: 10px auto; }
.modal-header { padding: 0 20px 14px; display: flex; align-items: flex-start; gap: 12px; }
.modal-header-content { flex: 1; }
.modal-header h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.modal-header .modal-emoji { font-size: 38px; line-height: 1; }
.modal-close { width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size: 18px; }
.modal-body { padding: 0 20px; }
.modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing:0.06em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.modal-body ul, .modal-body ol { padding-left: 22px; }
.modal-body li { font-size: 14px; line-height: 1.55; margin-bottom: 6px; }

/* TRACKING */
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.input-group input, .input-group textarea, .input-group select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: white;
  font-size: 16px;
  transition: border .15s, box-shadow .15s;
}
.input-group input:focus, .input-group textarea:focus, .input-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.weight-chart-container { background: var(--card); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 14px; }
.weight-chart-container h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.chart-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.chart-stat { text-align: center; }
.chart-stat .label { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chart-stat .value { font-size: 17px; font-weight: 700; margin-top: 2px; }

svg.chart { width: 100%; height: 180px; display: block; }

.log-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.log-item .info .date { font-size: 12px; color: var(--muted); }
.log-item .info .main { font-weight: 600; font-size: 15px; }
.log-item .info .secondary { font-size: 12px; color: var(--muted); margin-top: 2px; }
.log-item .del-btn { background: none; color: var(--danger); font-size: 13px; }

/* INFOS */
.info-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.info-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; display:flex; align-items:center; gap:8px; }
.info-card p, .info-card li { font-size: 14px; line-height: 1.55; color: var(--text); }
.info-card ul, .info-card ol { padding-left: 20px; margin-top: 4px; }
.info-card li { margin-bottom: 6px; }
.info-card .strong-text { font-weight: 600; }

.checklist-item {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #F4F4F5;
  cursor: pointer;
  user-select: none;
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item.checked .checklist-text { text-decoration: line-through; color: var(--muted); }
.checklist-checkbox {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: white;
  margin-top: 1px;
}
.checklist-item.checked .checklist-checkbox { background: var(--success); border-color: var(--success); }
.checklist-item.checked .checklist-checkbox::after { content:"✓"; color: white; font-size: 13px; font-weight: 700; }
.checklist-text { flex: 1; font-size: 14px; line-height: 1.5; }

/* TABBAR */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 6px 0 calc(6px + var(--safe-bottom));
  z-index: 50;
}
.tabbar-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 4px;
  color: var(--muted);
  transition: color .15s;
}
.tabbar-btn.active { color: var(--primary); }
.tabbar-btn .icon { font-size: 22px; line-height: 1; }
.tabbar-btn .label { font-size: 10px; font-weight: 600; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-state .icon { font-size: 40px; margin-bottom: 8px; }
.empty-state p { font-size: 14px; }
</style>
</head>
<body>

<header class="app-header">
  <h1>Trail 30 km</h1>
  <div class="subtitle">Course du 10 octobre 2026</div>
  <div class="countdown" id="countdown"></div>
</header>

<main>
  <!-- TODAY -->
  <section id="tab-today" class="tab-content active"></section>
  <!-- PLAN -->
  <section id="tab-plan" class="tab-content"></section>
  <!-- NUTRITION -->
  <section id="tab-nutrition" class="tab-content"></section>
  <!-- SUIVI -->
  <section id="tab-tracking" class="tab-content"></section>
  <!-- INFOS -->
  <section id="tab-info" class="tab-content"></section>
</main>

<nav class="tabbar">
  <button class="tabbar-btn active" data-tab="today"><span class="icon">🏃</span><span class="label">Aujourd'hui</span></button>
  <button class="tabbar-btn" data-tab="plan"><span class="icon">📅</span><span class="label">Plan</span></button>
  <button class="tabbar-btn" data-tab="nutrition"><span class="icon">🍽️</span><span class="label">Nutrition</span></button>
  <button class="tabbar-btn" data-tab="tracking"><span class="icon">📊</span><span class="label">Suivi</span></button>
  <button class="tabbar-btn" data-tab="info"><span class="icon">ℹ️</span><span class="label">Infos</span></button>
</nav>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-emoji" id="modal-emoji"></div>
      <div class="modal-header-content">
        <h2 id="modal-title"></h2>
        <div id="modal-subtitle" style="font-size:13px;color:var(--muted);margin-top:2px;"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// =============== DATA ===============
const START_DATE = new Date('2026-05-11T00:00:00');
const RACE_DATE = new Date('2026-10-10T00:00:00');

const WEEKS = [
  // PHASE 1
  { n:1, phase:1, dates:"11 - 17 mai", total:25, sessions:[

    {d:"Mer",t:"EF allure",x:"55 min EF (≈ 8 km), terrain vallonné si possible"},
    {d:"Jeu",t:"EF + renfo B",x:"40 min EF (≈ 6 km) + renfo core 15 min"},
    {d:"Ven",t:"MMA",x:"MMA 19h-20h30",mma:true},
    {d:"Sam",t:"Sortie longue",x:"1h05-1h15 EF (≈ 10-11 km), sentier si possible"},
    {d:"Dim",t:"Repos",x:"Repos complet ou marche active 30 min",rest:true}
  ]},
  { n:2, phase:1, dates:"18 - 24 mai", total:28, sessions:[
    {d:"Lun",t:"EF + renfo A",x:"50 min EF (≈ 7,5 km) + renfo bas du corps 15 min"},
    {d:"Mar",t:"MMA",x:"MMA 19h-20h30",mma:true},
    {d:"Mer",t:"EF",x:"55 min EF (≈ 8,5 km)"},
    {d:"Jeu",t:"EF + lignes droites",x:"45 min EF + 4 accélérations de 20s en fin"},
    {d:"Ven",t:"MMA",x:"MMA 19h-20h30",mma:true},

    {d:"Dim",t:"Repos",x:"Repos ou footing très lent 25 min",rest:true}
  ]},
  { n:3, phase:1, dates:"25 - 31 mai", total:32, sessions:[

    {d:"Mar",t:"MMA",x:"MMA",mma:true},
    {d:"Mer",t:"EF avec côtes",x:"60 min EF dont 6 côtes courtes (20s vite, retour en trot)"},
    {d:"Jeu",t:"EF",x:"45 min EF (≈ 7 km)"},
    {d:"Ven",t:"MMA",x:"MMA",mma:true},
    {d:"Sam",t:"Sortie longue",x:"1h25-1h35 EF (≈ 13-14 km), trail si possible"},
    {d:"Dim",t:"Récup",x:"30-40 min footing très lent OU repos",rest:true}
  ]},
  { n:4, phase:1, dates:"1 - 7 juin", total:23, decharge:true, sessions:[
    {d:"Lun",t:"EF + renfo A",x:"40 min EF (≈ 6 km) + renfo 15 min"},
    {d:"Mar",t:"MMA",x:"MMA",mma:true},

// =============== STORAGE ===============
const KEY = 'trail2026_v1';
function loadData() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch(e) { return {}; }
}
function saveData(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
let data = loadData();
data.completed = data.completed || {};
data.weight = data.weight || [];
data.weekly = data.weekly || [];
data.equipment = data.equipment || {};
saveData(data);

// =============== UTILS ===============
function getCurrentWeekIndex() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const diffDays = Math.floor((today - START_DATE) / (1000*60*60*24));
  if (diffDays < 0) return -1;
  const w = Math.floor(diffDays / 7);
  return w >= 22 ? 21 : w;
}
function getCurrentDayKey() {
  const today = new Date();
  const dayIdx = (today.getDay() + 6) % 7; // 0=Lun, 6=Dim
  return dayIdx;
}
const DAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
function fmtDate(d) {
  return new Date(d).toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}
function daysTo(target) {
  const today = new Date();
  today.setHours(0,0,0,0);
  return Math.floor((target - today) / (1000*60*60*24));
}

// =============== RENDER COUNTDOWN ===============
function renderCountdown() {
  const days = daysTo(RACE_DATE);
  const wi = getCurrentWeekIndex();
  const weekLabel = wi < 0 ? "Pas encore commencé" : wi >= 22 ? "Programme terminé" : `Semaine ${wi+1}/22 · Phase ${WEEKS[wi].phase}`;
  document.getElementById('countdown').innerHTML = `
    <div>
      <div style="opacity:0.8;font-size:11px;text-transform:uppercase;font-weight:600;">${weekLabel}</div>
      <div style="font-size:14px;margin-top:2px;">${days > 0 ? 'Jusqu\'au trail' : 'Course passée'}</div>
    </div>
    <div style="text-align:right;">
      <div class="countdown-number">${Math.max(0, days)}</div>
      <div style="opacity:0.8;font-size:11px;">jours</div>
    </div>
  `;
}

function toggleSession(wi, dayIdx) {
  const k = `${wi}_${dayIdx}`;
  if (data.completed[k]) delete data.completed[k];
  else data.completed[k] = true;
  saveData(data);
  renderToday();
  renderPlan();
}

    html += `<button class="phase-tab ${currentPhaseFilter === p.n ? 'active' : ''}" onclick="setPhaseFilter(${p.n})">Phase ${p.n}</button>`;
  });
  html += `</div>`;
  
  // Phase overview if filter active
  if (currentPhaseFilter !== null) {
    const p = PHASES[currentPhaseFilter - 1];
    html += `<div class="phase-overview">
      <div style="font-size:11px;font-weight:700;color:#92400E;text-transform:uppercase;letter-spacing:0.06em;">Phase ${p.n}</div>
      <div style="font-size:17px;font-weight:700;margin:2px 0;">${p.name}</div>
      <div style="font-size:13px;color:#92400E;"><strong>${p.dates}</strong> · ${p.obj} · ${p.vol}</div>
    </div>`;
  }
  
  // Weeks
  WEEKS.forEach((w, i) => {
    if (currentPhaseFilter !== null && w.phase !== currentPhaseFilter) return;
    
    const isCurrent = i === wi;
    const isOpen = openWeeks.has(i);
    const completedCount = w.sessions.filter((_, dIdx) => data.completed[`${i}_${dIdx}`]).length;
    
    let badges = '';
    if (w.decharge) badges += `<span class="badge muted">Décharge</span> `;
    if (w.race) badges += `<span class="badge accent">Semaine course</span> `;
    if (isCurrent) badges += `<span class="badge success">En cours</span> `;
    
    html += `<div class="week-card ${isOpen ? 'open' : ''} ${isCurrent ? 'current' : ''}">
      <div class="week-header" onclick="toggleWeek(${i})">
        <div class="week-header-left">
          <div class="week-num">Semaine ${w.n} · Phase ${w.phase}</div>
          <div class="week-title">${w.dates} ${badges}</div>
          <div class="week-meta">${w.total} km de course</div>
        </div>
        <div class="week-progress">${completedCount}/${w.sessions.length}</div>
        <div class="week-chevron">▼</div>
      </div>
      <div class="week-body">`;
    
    w.sessions.forEach((s, dIdx) => {
      const isDone = data.completed[`${i}_${dIdx}`];
      const cls = s.mma ? 'mma' : s.rest ? 'rest' : '';
      html += `<div class="session-item ${cls}">
        <div class="session-checkbox ${isDone ? 'checked' : ''}" onclick="toggleSession(${i}, ${dIdx})"></div>

    });
    
    html += `</div></div>`;
  });
  
  document.getElementById('tab-plan').innerHTML = html;
}

function renderWeightChart(sorted) {
  const w = 320, h = 160, pad = 30;
  const weights = sorted.map(x => x.weight);
  const min = Math.min(67, ...weights) - 0.5;
  const max = Math.max(73, ...weights) + 0.5;
  const range = max - min;
  
  const dates = sorted.map(x => new Date(x.date).getTime());
  const startMs = START_DATE.getTime();
  const endMs = RACE_DATE.getTime();
  const fullRange = endMs - startMs;
  
  const pts = sorted.map(p => {
    const t = (new Date(p.date).getTime() - startMs) / fullRange;
    const x = pad + t * (w - 2*pad);
    const y = pad + (1 - (p.weight - min) / range) * (h - 2*pad);
    return { x, y, w: p.weight };
  });
  
  // Target line (67 kg)
  const targetY = pad + (1 - (67 - min) / range) * (h - 2*pad);
  
  let path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  let dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#0F766E"/>`).join('');
  
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${pad}" y1="${targetY}" x2="${w-pad}" y2="${targetY}" stroke="#EA580C" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
    <text x="${w-pad+2}" y="${targetY+3}" font-size="10" fill="#EA580C" text-anchor="end" style="font-weight:600;">67kg</text>
    ${pts.length > 1 ? `<path d="${path}" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${dots}
    <text x="${pad-4}" y="${pad+4}" font-size="9" fill="#71717A" text-anchor="end">${max.toFixed(1)}</text>
    <text x="${pad-4}" y="${h-pad+4}" font-size="9" fill="#71717A" text-anchor="end">${min.toFixed(1)}</text>
    <text x="${pad}" y="${h-8}" font-size="9" fill="#71717A">11 mai</text>
    <text x="${w-pad}" y="${h-8}" font-size="9" fill="#71717A" text-anchor="end">10 oct</text>
  </svg>`;
}

function addWeight() {
  const date = document.getElementById('weight-date').value;
  const val = parseFloat(document.getElementById('weight-val').value);
  if (!date || !val) { alert("Date et poids requis"); return; }
  data.weight.push({ id: Date.now().toString(), date, weight: val });
  saveData(data);
  renderTracking();
}

function delWeight(id) {
  data.weight = data.weight.filter(w => w.id !== id);
  saveData(data);
  renderTracking();
}

function addWeekly() {
  const week = parseInt(document.getElementById('week-select').value);
  const km = parseFloat(document.getElementById('week-km').value);
  const ressenti = parseInt(document.getElementById('week-ressenti').value);
  const notes = document.getElementById('week-notes').value;
  if (isNaN(week) || isNaN(km) || isNaN(ressenti)) { alert("Km et ressenti requis"); return; }
  // remplace si existe déjà
  data.weekly = data.weekly.filter(w => w.week !== week);
  data.weekly.push({ id: Date.now().toString(), week, km, ressenti, notes });
  saveData(data);
  document.getElementById('week-km').value = '';
  document.getElementById('week-ressenti').value = '';
  document.getElementById('week-notes').value = '';
  renderTracking();
}

function delWeekly(id) {
  data.weekly = data.weekly.filter(w => w.id !== id);
  saveData(data);
  renderTracking();
}

function exportData() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trail2026-export-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function resetData() {
  if (!confirm("Effacer toutes les données (poids, séances cochées, suivi) ? Cette action est irréversible.")) return;
  localStorage.removeItem(KEY);
  data = { completed:{}, weight:[], weekly:[], equipment:{} };
  saveData(data);
  renderToday();
  renderPlan();
  renderTracking();
}

      <li>Échauffement 3 min</li>
      <li>Step-ups : 3 × 12 par jambe</li>
      <li>Squats 1 jambe (assist) : 3 × 6 par jambe</li>
      <li>Pompes : 3 × max</li>
      <li>Side plank : 3 × 30 s par côté</li>
      <li>Dead bug : 3 × 10 par côté</li>
      <li>Superman : 3 × 12</li>
      <li>Mobilité 3 min</li>
    </ul>
  </div>`;
  
  // Matériel
  html += `<div class="info-card">
    <h3>🎒 Matériel trail 30 km</h3>`;
  EQUIPMENT.forEach(g => {
    html += `<div style="margin-top:14px;">
      <div class="strong-text" style="font-size:14px;margin-bottom:6px;">${g.cat}</div>`;
    g.items.forEach((item, i) => {
      const k = `${g.cat}_${i}`;
      const checked = data.equipment[k];
      html += `<div class="checklist-item ${checked ? 'checked' : ''}" onclick="toggleEquip('${k}')">
        <div class="checklist-checkbox"></div>
        <div class="checklist-text">${item}</div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  
  // Planning rappel
  html += `<div class="info-card">
    <h3>⏰ Planning hebdo type</h3>
    <ul>
      <li><strong>Lun :</strong> Course 16h30-17h30 + renfo A</li>
      <li><strong>Mar :</strong> MMA 19h-20h30 (pas de course)</li>
      <li><strong>Mer :</strong> Séance qualité 16h30-18h</li>
      <li><strong>Jeu :</strong> Course 16h30-17h30 + renfo B</li>
      <li><strong>Ven :</strong> MMA 19h-20h30 (pas de course)</li>
      <li><strong>Sam :</strong> Sortie longue 8h-11h</li>
      <li><strong>Dim :</strong> Repos OU footing récup, batch cooking</li>
    </ul>
    <p style="margin-top:10px;font-size:13px;color:var(--muted);"><strong>Astuce :</strong> collation à 16h-16h10 avant la course (banane + dattes ou pain + miel). Shake de récup dans les 30 min après.</p>
  </div>`;
  
  document.getElementById('tab-info').innerHTML = html;
}

function showInfoModal(key) {
  const info = INFOS[key];
  if (!info) return;
  document.getElementById('modal-emoji').textContent = info.title.split(' ')[0];
  document.getElementById('modal-title').textContent = info.title.substring(2).trim();
  document.getElementById('modal-subtitle').textContent = '';
  let html = '';
  info.sections.forEach(s => {
    html += `<h3>${s.h}</h3><ul>${s.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
  });
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function toggleEquip(k) {
  if (data.equipment[k]) delete data.equipment[k];
  else data.equipment[k] = true;
  saveData(data);
  renderInfo();
}

// =============== TABS NAV ===============
document.querySelectorAll('.tabbar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabbar-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    window.scrollTo(0, 0);
  });
});

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

// =============== INIT ===============
renderCountdown();
renderToday();
renderPlan();
renderNutrition();
renderTracking();
renderInfo();
</script>
</body>
</html>
